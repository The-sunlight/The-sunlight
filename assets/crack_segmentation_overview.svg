<svg width="1800" height="1080" viewBox="0 0 1800 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rock slope crack segmentation research loop</title>
  <desc id="desc">A vector overview of source pretraining, real transfer, error audit, and evidence-guided adaptation for rock slope crack segmentation.</desc>
  <defs>
    <style>
      .title { font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #1d1c1a; }
      .subtitle { font: 400 25px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #625d55; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      .card-title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #1d1c1a; }
      .card-text { font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #5f5a52; }
      .small-title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #1d1c1a; }
      .small-text { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #5f5a52; }
      .metric { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #1d1c1a; }
      .metric-label { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #6f675d; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#211f1b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L14 8L2 14Z" fill="#2f6462"/>
    </marker>
    <marker id="arrow-rust" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L14 8L2 14Z" fill="#8a4f35"/>
    </marker>
  </defs>

  <rect width="1800" height="1080" fill="#fbfaf7"/>
  <text x="90" y="92" class="title">Rock Slope Crack Segmentation</text>
  <text x="90" y="135" class="subtitle">A protocol-first research loop for public-to-real crack segmentation.</text>
  <line x1="90" y1="170" x2="1710" y2="170" stroke="#d8d1c6" stroke-width="2"/>

  <rect x="390" y="210" width="1020" height="104" rx="28" fill="#1d1c1a"/>
  <text x="445" y="250" class="label" fill="#efeae1">Goal</text>
  <text x="445" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">Robust crack segmentation in real mine-slope scenes</text>

  <g filter="url(#shadow)">
    <rect x="110" y="390" width="360" height="230" rx="26" fill="#ffffff" stroke="#d8d1c6" stroke-width="2"/>
    <rect x="110" y="390" width="360" height="10" fill="#2f6462"/>
    <rect x="142" y="430" width="48" height="48" rx="14" fill="#e8f0ef" stroke="#2f6462" stroke-width="2"/>
    <text x="158" y="462" font-size="25" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#2f6462">1</text>
    <text x="210" y="462" class="card-title">Source Pretraining</text>
    <circle cx="162" cy="520" r="5" fill="#2f6462"/><text x="182" y="528" class="card-text">Public crack datasets</text>
    <circle cx="162" cy="560" r="5" fill="#2f6462"/><text x="182" y="568" class="card-text">Final source checkpoint</text>
    <circle cx="162" cy="600" r="5" fill="#2f6462"/><text x="182" y="608" class="card-text">Diversity as baseline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="570" y="390" width="360" height="230" rx="26" fill="#ffffff" stroke="#d8d1c6" stroke-width="2"/>
    <rect x="570" y="390" width="360" height="10" fill="#355c7d"/>
    <rect x="602" y="430" width="48" height="48" rx="14" fill="#e9eef3" stroke="#355c7d" stroke-width="2"/>
    <text x="618" y="462" font-size="25" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#355c7d">2</text>
    <text x="670" y="462" class="card-title">Real Transfer</text>
    <circle cx="622" cy="520" r="5" fill="#355c7d"/><text x="642" y="528" class="card-text">120 slope images</text>
    <circle cx="622" cy="560" r="5" fill="#355c7d"/><text x="642" y="568" class="card-text">96 / 12 / 12 split</text>
    <circle cx="622" cy="600" r="5" fill="#355c7d"/><text x="642" y="608" class="card-text">Full-source → Real</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="570" y="710" width="360" height="230" rx="26" fill="#ffffff" stroke="#d8d1c6" stroke-width="2"/>
    <rect x="570" y="710" width="360" height="10" fill="#8a4f35"/>
    <rect x="602" y="750" width="48" height="48" rx="14" fill="#f4ece8" stroke="#8a4f35" stroke-width="2"/>
    <text x="618" y="782" font-size="25" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#8a4f35">3</text>
    <text x="670" y="782" class="card-title">Error Audit</text>
    <circle cx="622" cy="840" r="5" fill="#8a4f35"/><text x="642" y="848" class="card-text">Thin-crack misses</text>
    <circle cx="622" cy="880" r="5" fill="#8a4f35"/><text x="642" y="888" class="card-text">Rock-texture false positives</text>
    <circle cx="622" cy="920" r="5" fill="#8a4f35"/><text x="642" y="928" class="card-text">Label review candidates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="710" width="360" height="230" rx="26" fill="#ffffff" stroke="#d8d1c6" stroke-width="2"/>
    <rect x="1030" y="710" width="360" height="10" fill="#8a4f35"/>
    <rect x="1062" y="750" width="48" height="48" rx="14" fill="#f4ece8" stroke="#8a4f35" stroke-width="2"/>
    <text x="1078" y="782" font-size="25" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#8a4f35">4</text>
    <text x="1130" y="770" class="card-title">Evidence-Guided</text>
    <text x="1130" y="807" class="card-title">Adaptation</text>
    <circle cx="1082" cy="855" r="5" fill="#8a4f35"/><text x="1102" y="863" class="card-text">Morphology filtering</text>
    <circle cx="1082" cy="895" r="5" fill="#8a4f35"/><text x="1102" y="903" class="card-text">Crop-bank diagnostics</text>
    <circle cx="1082" cy="935" r="5" fill="#8a4f35"/><text x="1102" y="943" class="card-text">Anchor teacher</text>
  </g>

  <path d="M470 505H552" stroke="#2f6462" stroke-width="6" marker-end="url(#arrow-teal)"/>
  <path d="M750 620V692" stroke="#8a4f35" stroke-width="6" marker-end="url(#arrow-rust)"/>
  <path d="M930 825H1012" stroke="#8a4f35" stroke-width="6" marker-end="url(#arrow-rust)"/>
  <g filter="url(#shadow)">
    <rect x="1030" y="390" width="660" height="230" rx="26" fill="#ffffff" stroke="#d8d1c6" stroke-width="2"/>
    <rect x="1030" y="390" width="660" height="10" fill="#b08a3c"/>
    <text x="1070" y="448" class="card-title">Evidence from Experiment Logs</text>
    <line x1="1070" y1="475" x2="1650" y2="475" stroke="#eee7da" stroke-width="2"/>

    <rect x="1070" y="500" width="170" height="78" rx="16" fill="#f5f0e5" stroke="#eadfca"/>
    <text x="1090" y="535" class="metric">66.45</text>
    <text x="1090" y="560" class="metric-label">public IoU</text>

    <rect x="1270" y="500" width="170" height="78" rx="16" fill="#e8f0ef" stroke="#d7e5e2"/>
    <text x="1290" y="535" class="metric">48.43</text>
    <text x="1290" y="560" class="metric-label">real IoU</text>

    <rect x="1470" y="500" width="180" height="78" rx="16" fill="#f4ece8" stroke="#eadad1"/>
    <text x="1490" y="531" class="small-title" fill="#8a4f35">Failures</text>
    <text x="1490" y="558" class="metric-label">thin FN · texture FP</text>

    <text x="1070" y="612" class="small-text">Anchor-based conservative adaptation gave the clearest positive signal.</text>
  </g>

  <rect x="110" y="988" width="1580" height="54" rx="20" fill="#ffffff" stroke="#d8d1c6" stroke-width="1.5"/>
  <text x="145" y="1024" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#1d1c1a">Principle:</text>
  <text x="260" y="1024" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5a52">fix the protocol first, then let real error evidence decide the next experiment.</text>
</svg>
